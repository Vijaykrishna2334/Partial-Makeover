        const FIXED_VS_NON_FIXED_PARTS = `
**1. Fixed Parts**
- **Definition**: Core structural elements of the home. These are IMMUTABLE. Permanently attached and must not be altered, moved, or removed in the output image.
- **Examples**:
  - Walls (position, thickness, and any openings are immutable)
  - Windows & window frames (size, position, shape, and muntin/grille pattern are immutable)
  - Doors & door frames (size, position, shape, and panel design are immutable)
  - Structural ceiling slab (height and shape are immutable. Beams are part of the structure and must not be changed.)
  - Staircases (steps, railing, balustrades)
  - Fireplace (core masonry/firebox)
  - Kitchen islands / peninsulas (structural base with plumbing/electrical)
  - Kitchen sink basin (built-in)
  - Bathroom fittings (toilet, bathtub, fixed sink basins, shower enclosures)
  - Utility sink / laundry basin
  - Structural pillars & beams
  - In-built niches (alcoves, wall recesses)
  - Built-in carcasses (wardrobes, cabinetry shells)
  - Balconies & terraces (structural slab & railing base)

**2. Non-Fixed Parts**
- **Definition**: All items, finishes, and fixtures that can be changed, upgraded, or styled during interior design projects. These are the ONLY elements you are allowed to modify.
- **Examples**:
  **1. Surfaces & Finishes**
  - Flooring materials (tiles, wood planks, vinyl, carpet rolls)
  - Wall finishes (paint, wallpaper, wall panels, cladding, realistic veneers like thin brick or board-formed concrete plaster)
  - Ceiling finishes (paint, wallpaper, decorative panels, faux beams, acoustic panels, ceiling tiles)
  - Kitchen & bathroom backsplashes (tiles, stone, glass, metal)
  - Cabinet finishes (doors, shutters, laminates, veneers)
  - Hardware (handles, knobs, pulls, locks for doors/cabinets/windows)
  - Kitchen island cladding & countertop finishes
  - Fireplace cladding & mantels
  - Balcony/terrace flooring, railing finishes, wall finishes

  **2. Fixtures (Design-relevant)**
  - Ceiling fans
  - Ceiling light fixtures (chandeliers, pendants, flush mounts)
  - Wall-mounted sconces / fixed wall lights
  - Switchboards & sockets (styling finishes, smart switches)
  - False ceiling frameworks (POP, gypsum boards, tray/coffered layouts)
  - Recessed lighting (spotlights, cove lights, LED strips)
  - Air-conditioning units (split ACs, vents, duct covers)
  - Heaters / radiators (designer finishes)
  - Water heaters (visible models with design impact)
  - Projectors, retractable screens
  - Exhaust fans (designer vent covers)
  - Ceiling/in-wall speaker systems (design-integrated)
  - Faucets, taps, showerheads, spouts
  - Kitchen chimney / range hood (designer finishes)
  - Built-in water purifiers (visible panels)
  - Intercom systems, smart home panels

  **3. Furniture**
  - Beds, sofas, chairs, stools, ottomans

**Ground Rule**: Base lighting hue is determined by the chosen style and never changes with mood. Mood only changes the intensity, spread, and strategy of the light, not its inherent color temperature.

**Intensity (Low / Medium / High)**
- **What it means**: The overall level of ambient light in the room.
- **Low**: Creates intimacy and drama. Shadows are deep and a significant part of the composition. Requires focused pools of light for tasks. (Think restaurant, lounge).
- **Medium**: Comfortable, functional, and clear. Mimics a well-lit interior during the day. Shadows are present but not dominant. (Think everyday living).
- **High**: Energetic and clean. Floods the space with light, minimizing shadows significantly. (Think gallery, retail, or a very sunny room).

**Feel (Soft / Neutral / Crisp)**
- **What it means**: The quality of the light and the sharpness of the shadows it creates.
- **Soft**: Light is heavily diffused, creating blurry-edged, gentle shadows. Low contrast, low glare. (Think light through a frosted window or a large lampshade).
- **Neutral**: Balanced light, like an overcast day. Shadows are visible with moderately defined edges, but not harsh. (Think standard ambient lighting).
- **Crisp**: Light is direct and focused, creating sharp, well-defined shadows. High contrast, highlights textures. (Think direct sunlight or a spotlight).
`;

          const reader = new FileReader();
          reader.readAsDataURL(file);

          reader.onerror = error => reject(error);

            if (e.type === "dragenter" || e.type === "dragover") {
              setDragActive(true);

            }
          };

            setDragActive(false);

              onImageUpload(e.dataTransfer.files[0]);

          };
          
          const handleChange = (e) => {

        function App() {

                setHistory(savedHistory);

            fetchHistory();

          const currentUsageOptions = useMemo(() => {
            return ROOM_USAGE_OPTIONS[designParams.roomType] || [];
          }, [designParams.roomType]);

          const handleImageUpload = async (file) => {
            try {

                setOriginalImage({ data: `data:${file.type};base64,${base64}`, file });
                setStep(AppStep.Customize);
            } catch(err) {
                setError('Failed to read image file.');
            }

          const handleParamChange = (key, value) => {
            setDesignParams(prev => {
              const newState = { ...prev, [key]: value };
              if (key === 'roomType') {
                newState.roomUsage = [];
              }
              return newState;
            });
          };
          
          const handleUsageChange = (usage) => {
              setDesignParams(prev => {
                  const newUsage = prev.roomUsage.includes(usage) 
                      ? prev.roomUsage.filter(u => u !== usage)
                      : [...prev.roomUsage, usage];
                  return { ...prev, roomUsage: newUsage };
              });
          };

          const handleGenerate = useCallback(async () => {
            if (!originalImage.file) {
              setError("No image selected.");
              return;
            }
            
            if (designParams.roomUsage.length < 3 || designParams.roomUsage.length > 5) {
                setError("Please select 3 to 5 room usages.");

            }

            setError(null);
            setStep(AppStep.Generating);

            try {
              const base64Data = originalImage.data.split(',')[1];
              const result = await generateRoomMakeover(base64Data, originalImage.file.type, designParams);
              setGeneratedResult(result);

              const newHistoryItem = {
                  id: Date.now(),
                  originalImage: originalImage.data,
                  generatedImage: result.imageUrl,
                  description: result.text,
                  prompt: result.prompt,
              };
              
              const updatedHistory = [newHistoryItem, ...history];
              setHistory(updatedHistory);
              await saveDesign(newHistoryItem);

              setStep(AppStep.Result);
            } catch (err) {
              const errorMessage = err instanceof Error ? err.message : "An unknown error occurred.";
              setError(`Generation failed: ${errorMessage}`);
              setStep(AppStep.Customize);

          }, [originalImage, designParams, history]);
          
          const handleRefine = useCallback(async () => {
            if (!originalImage.file || !refinementPrompt.trim()) {
                setError("Please enter a refinement request.");

            setError(null);
            setStep(AppStep.Generating);
            
            const refinedParams = {
                ...designParams,
                specialRequests: `${designParams.specialRequests}\n\n--- PREVIOUSLY GENERATED, NOW REFINE ---\nRefinement Request: ${refinementPrompt}`.trim()

            try {
                const base64Data = originalImage.data.split(',')[1];
                const result = await generateRoomMakeover(base64Data, originalImage.file.type, refinedParams);

                  originalImage: originalImage.data,
                  generatedImage: result.imageUrl,
                  description: result.text,
                  prompt: result.prompt,

                const updatedHistory = [newHistoryItem, ...history];
                setHistory(updatedHistory);
                await saveDesign(newHistoryItem);

                setDesignParams(refinedParams); 
                setRefinementPrompt('');
                setStep(AppStep.Result);
            } catch (err) {
                const errorMessage = err instanceof Error ? err.message : "An unknown error occurred.";
                setError(`Refinement failed: ${errorMessage}`);
                setStep(AppStep.Result);
            }
          }, [originalImage, designParams, refinementPrompt, history]);

          const handleStartOver = () => {
            setStep(AppStep.Upload);
            setOriginalImage({ data: '', file: null });
            setGeneratedResult({ imageUrl: '', text: '', prompt: '' });
            setError(null);
            setDesignParams(INITIAL_DESIGN_PARAMS);
            setRefinementPrompt('');
          };

          const isGenerationDisabled = (designParams.roomUsage.length < 3 || designParams.roomUsage.length > 5);

          return (
            <div className="min-h-screen flex flex-col bg-slate-50">
              <Header />
              <main className="flex-grow container mx-auto px-4 py-8">
                <div className="flex items-start justify-center">
                    {step === AppStep.Upload && <ImageUploader onImageUpload={handleImageUpload} title="1. Upload a Photo of Your Room" subtitle="Start by showing us your current space."/>}

                    {step === AppStep.Customize && (
                      <div className="w-full max-w-5xl">
                        {error && <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">{error}</div>}
                        
                        <div className="mb-8 p-6 bg-white rounded-lg shadow-md">
                            <div className="text-center mb-6">
                                <h2 className="text-2xl font-bold text-slate-800">Your Room</h2>
                                <img src={originalImage.data} alt="Your room" className="rounded-lg shadow-lg w-full max-w-sm mx-auto mt-4" />
                            </div>
                        </div>
                                        
                        <div className="bg-white p-6 rounded-lg shadow-md">
                            <h2 className="text-3xl font-bold text-slate-800 mb-4 text-center">2. Customize Your Design</h2>
                            <CardSelector
                              title="Room Type"
                              subtitle="What type of room is this?"
                              options={ROOM_TYPE_OPTIONS}
                              selectedValue={designParams.roomType}
                              onChange={(val) => handleParamChange('roomType', val)}
                              type="radio"
                            />
                            <CardSelector
                              title="Room Usage"
                              subtitle="How will you use this room? (Select 3-5)"
                              options={currentUsageOptions}
                              selectedValue={designParams.roomUsage}
                              onChange={handleUsageChange}
                              type="checkbox"
                            />
                            {designParams.roomUsage.length > 5 && (
                              <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative -mt-4 mb-4" role="alert">
                                <strong className="font-bold">Too many selections!</strong>
                                <span className="block sm:inline"> Please select a maximum of 5 room usages.</span>
                              </div>
                            )}
                            <CardSelector
                              title="Room Feel"
                              subtitle="How should this room feel?"
                              options={ROOM_FEEL_OPTIONS}
                              selectedValue={designParams.roomFeel}
                              onChange={(val) => handleParamChange('roomFeel', val)}
                              type="radio"
                            />
                            <CardSelector
                              title="Design Style"
                              subtitle="Choose the aesthetic for your room."
                              options={ROOM_STYLE_OPTIONS}
                              selectedValue={designParams.roomStyle}
                              onChange={(val) => handleParamChange('roomStyle', val)}
                              type="radio"
                            />
                        </div>
                        
                        <div className="mt-8 bg-white p-6 rounded-lg shadow-md">
              _B_a_c_k_t_o_ _U_s_e_r_ _
                            <p className="text-slate-500 mt-1 mb-4">
                              Any specific details? e.g., "I'd like a blue sofa" or "No leather furniture".
                            </p>
                            <textarea
                                value={designParams.specialRequests}
                                onChange={(e) => handleParamChange('specialRequests', e.target.value)}
                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                rows={3}
                                placeholder="Enter your request here..."
                            />
                        </div>
                        
                        <div className="text-center mt-8">
                          <button
                            onClick={handleGenerate}
                            disabled={isGenerationDisabled}
                            className="px-10 py-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors text-lg disabled:bg-slate-400 disabled:cursor-not-allowed"
                          >
                            Generate My Design
                          </button>
                        </div>
                      </div>
                    )}

                    {step === AppStep.Generating && <GeneratingView />}
                    
                    {step === AppStep.Result && (
                        <ResultView 
                            original={originalImage.data}
                            generated={generatedResult.imageUrl}
                            description={generatedResult.text}
                            prompt={generatedResult.prompt}
                            designParams={designParams}
                            onStartOver={handleStartOver}
                            refinementPrompt={refinementPrompt}
                            onRefinementChange={setRefinementPrompt}
                            onRefine={handleRefine}
                        />
                    )}
                </div>
                <div className="mt-16 flex justify-center">
                    <HistoryView history={history} />
                </div>
              </main>
              <footer className="text-center py-4 text-slate-500 text-sm">
                <p>Powered by Google Gemini. Designs are AI-generated.</p>
              </footer>
            </div>
          );
        }

        // --- From index.tsx ---
        const rootElement = document.getElementById('root');
        if (!rootElement) {
          throw new Error("Could not find root element to mount to");
        }

        const root = ReactDOM.createRoot(rootElement);
        root.render(
          <React.StrictMode>
            <App />
          </React.StrictMode>
        );
    </script>
  </body>
</html>
